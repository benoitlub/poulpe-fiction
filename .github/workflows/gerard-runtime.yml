name: Gerard runtime

on:
  schedule:
    - cron: "17 */3 * * *"
  push:
    paths:
      - "garden/restart-seeds.json"
      - "scripts/gerard-cycle.mjs"
      - "garden/restart-seeds.json"
      - ".github/workflows/gerard-runtime.yml"
  workflow_dispatch: {}

concurrency:
  group: gerard-runtime
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      OCTOPUS_URL: http://127.0.0.1:3000
      # Harvests must target the deployed Cloudflare Publisher Worker: the
      # local Express API-server does not expose /api/tentacles/*.
      PUBLISHER_URL: https://blacklace-publisher-worker.benoitlubert.workers.dev
      LOCAL_PUBLISHER_URL: http://127.0.0.1:3100
      PUBLISHER_ADAPTER_URL: http://127.0.0.1:3100/api/octopus-adapter/execute
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_PROVIDER: mistral
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      GERARD_MODE: ${{ github.event_name == 'workflow_dispatch' && 'cultivate' || '' }}
    steps:
      - name: Check runtime secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MISTRAL_API_KEY" || { echo "Missing MISTRAL_API_KEY"; exit 1; }
          test -n "$DATABASE_URL" || { echo "Missing DATABASE_URL"; exit 1; }

      - name: Checkout Poulpe Fiction
        uses: actions/checkout@v4
        with:
          path: poulpe-fiction

      - name: Checkout Octopus Engine
        uses: actions/checkout@v4
        with:
          repository: benoitlub/octopus-engine
          path: octopus

      - name: Checkout Publisher
        uses: actions/checkout@v4
        with:
          repository: benoitlub/blacklace-publisher-ai
          path: publisher

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build Octopus Engine
        working-directory: octopus
        run: |
          npm install
          npm run build

      - name: Install Publisher
        working-directory: publisher
        run: |
          corepack enable
          pnpm install --no-frozen-lockfile

      # Do NOT run the DB push here: it can propose destructive schema changes
      # against the shared production database and requires an interactive TTY.
      # The deployed Worker ensures the existing schema without destroying data.

      - name: Build Publisher
        working-directory: publisher
        run: pnpm --filter @workspace/api-server run build

      - name: Start Octopus Engine locally
        working-directory: octopus
        run: |
          nohup env PORT=3000 NODE_ENV=production npm start > ../octopus.log 2>&1 &
          echo $! > ../octopus.pid

      - name: Start Publisher locally
        working-directory: publisher
        run: |
          nohup env PORT=3100 NODE_ENV=production DATABASE_URL="$DATABASE_URL" NOTION_API_KEY="$NOTION_API_KEY" NOTION_PAGE_ID="$NOTION_PAGE_ID" pnpm --filter @workspace/api-server run start > ../publisher.log 2>&1 &
          echo $! > ../publisher.pid

      - name: Wait for local services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            OCTOPUS_UP=false
            PUBLISHER_UP=false
            curl --fail --silent "$OCTOPUS_URL/health" >/dev/null && OCTOPUS_UP=true || true
            curl --fail --silent "$LOCAL_PUBLISHER_URL/api/healthz" >/dev/null && PUBLISHER_UP=true || true
            if [ "$OCTOPUS_UP" = true ] && [ "$PUBLISHER_UP" = true ]; then exit 0; fi
            if ! kill -0 "$(cat octopus.pid)" 2>/dev/null; then cat octopus.log || true; exit 1; fi
            if ! kill -0 "$(cat publisher.pid)" 2>/dev/null; then cat publisher.log || true; exit 1; fi
            sleep 2
          done
          cat octopus.log || true
          cat publisher.log || true
          exit 1

      - name: Register Publisher adapter with Octopus
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "$OCTOPUS_URL/adapters/register" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg executeUrl "$PUBLISHER_ADAPTER_URL" '{id:"publisher",name:"Blacklace Publisher",version:"github-actions",capabilities:["knowledge.search","tool.search","copy.generate","content.article.write","content.social.write","social.publish","landing.generate"],executeUrl:$executeUrl}')"

      - name: Sync restart Seeds to Publisher
        working-directory: poulpe-fiction
        shell: bash
        run: |
          set -euo pipefail
          test -f garden/restart-seeds.json || exit 0
          curl --fail --silent --show-error \
            -X POST "$PUBLISHER_URL/api/tentacles/sync" \
            -H "Content-Type: application/json" \
            --data @garden/restart-seeds.json

      - name: Select existing article candidate
        working-directory: poulpe-fiction
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$PUBLISHER_URL/api/tentacles/iterations?limit=200" > /tmp/gerard-iterations.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/gerard-iterations.json', 'utf8'));
          const iterations = Array.isArray(payload.iterations) ? payload.iterations : [];
          const bookWords = /vacances interdites|feulette|kif\s*&?\s*molla|neverland|terra|livre|roman|kdp/i;
          const articleWords = /article|chronique|présent|decouvr|découvr|lecture|roman|livre|auteur/i;
          const candidates = iterations
            .filter((item) => typeof item.content === 'string' && item.content.trim().length >= 400)
            .map((item) => {
              const haystack = [item.title, item.mode, item.content].filter(Boolean).join('\n');
              const score = (bookWords.test(haystack) ? 10 : 0) + (articleWords.test(haystack) ? 5 : 0) + Math.min(5, Math.floor(item.content.length / 1000));
              return { ...item, score };
            })
            .filter((item) => item.score >= 10)
            .sort((a, b) => b.score - a.score || String(b.created_at).localeCompare(String(a.created_at)));
          const candidate = candidates[0] ?? null;
          fs.writeFileSync('garden/article-candidate.json', JSON.stringify({
            selectedAt: new Date().toISOString(),
            source: 'publisher-tentacle-iterations',
            candidateCount: candidates.length,
            candidate: candidate && {
              id: candidate.id,
              seedId: candidate.seed_id,
              parcelId: candidate.parcel_id,
              title: candidate.title,
              mode: candidate.mode,
              content: candidate.content,
              createdAt: candidate.created_at,
              score: candidate.score
            }
          }, null, 2) + '\n');
          console.log(JSON.stringify({ candidateCount: candidates.length, selected: candidate && { id: candidate.id, seedId: candidate.seed_id, title: candidate.title, mode: candidate.mode, createdAt: candidate.created_at, score: candidate.score, contentLength: candidate.content.length } }, null, 2));
          NODE

      - name: Run Gerard cycle
        working-directory: poulpe-fiction
        env:
          GERARD_MODE: cultivate
        run: node scripts/gerard-cycle.mjs

      - name: Validate real harvest result
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: poulpe-fiction
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const state = JSON.parse(fs.readFileSync('garden/gerard-state.json', 'utf8'));
          const result = state.lastResult || {};
          console.log(JSON.stringify({ mode: state.lastMode, status: result.status, httpStatus: result.httpStatus, harvestMode: result.harvestMode, verification: result.verification, payload: result.payload }, null, 2));
          if (state.lastMode !== 'cultivate') throw new Error(`Expected cultivate, got ${state.lastMode}`);
          if (result.status !== 'ok') throw new Error(`Harvest endpoint failed: ${result.status}`);
          if (result.verification && result.verification.processed < 1) throw new Error('No tentacle was processed.');
          NODE

      - name: Commit updated Gerard state
        working-directory: poulpe-fiction
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain garden/gerard-state.json garden/article-candidate.json)" ]; then
            git config user.name "gerard-runtime[bot]"
            git config user.email "gerard-runtime@users.noreply.github.com"
            git add garden/gerard-state.json garden/article-candidate.json
            git commit -m "chore(gerard): update autonomous cycle state"
            # main may advance while Gérard is running; keep the state-only
            # commit and replay it on the current branch head.
            git pull --rebase origin main
            git push
          else
            echo "Aucun changement d'état à committer."
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerard-runtime-logs
          path: |
            octopus.log
            publisher.log
          retention-days: 7
