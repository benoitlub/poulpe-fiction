name: Identify existing Mistral credential
on:
  push:
    branches: [diagnostic/mistral-key-comparison-20261126]
    paths: [.github/workflows/mistral-key-comparison.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Identify key without exposing it and test only named keys
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {createHash} from 'node:crypto';
          const key=(process.env.MISTRAL_API_KEY||'').trim();
          const label=key?(key.endsWith('x9P2')?'octo':key.endsWith('4izP')?'Pulpito':'unidentified'):'missing';
          console.log(JSON.stringify({repository:process.env.GITHUB_REPOSITORY,label,fingerprint:key?createHash('sha256').update(key).digest('hex').slice(0,16):null}));
          if(label==='octo'||label==='Pulpito'){
            const response=await fetch('https://api.mistral.ai/v1/chat/completions',{method:'POST',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:JSON.stringify({model:'ministral-8b-2512',messages:[{role:'user',content:'Réponds uniquement OK.'}],max_tokens:8,temperature:0}),signal:AbortSignal.timeout(45000)});
            const data=await response.json().catch(()=>({}));
            console.log(JSON.stringify({label,httpStatus:response.status,code:data.code,message:String(data.message||'').replaceAll(key,'[REDACTED]').slice(0,300),reply:data.choices?.[0]?.message?.content}));
          }
          if(process.env.GITHUB_REPOSITORY==='benoitlub/poulpe-fiction'){
            const prompt='Diagnostic technique. Réponds uniquement OK, sans autre mot.';
            function mission(name){return {operationId:'key-check-'+name+'-'+crypto.randomUUID(),title:'Owner requested credential diagnostic',objective:prompt,prompt,context:{id:'credential-diagnostic',label:'Owner requested technical check'},requiredCapabilities:['copy.generate']};}
            for(const [route,url,payload] of [
              ['Octopus deployed','https://octopus-engine-app.benoitlubert.workers.dev/mission',mission('octopus')],
              ['Publisher deployed','https://blacklace-publisher-worker.benoitlubert.workers.dev/api/octopus-adapter/execute',{contract:'octopus-adapter-execution-v1',mission:mission('publisher')}]
            ]){
              try{
                const response=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(60000)});
                const data=await response.json().catch(()=>({}));
                const result={route,httpStatus:response.status,status:data.status,code:data.code};
                for(const field of ['summary','message','error']) if(typeof data[field]==='string') result[field]=data[field].replaceAll(key,'[REDACTED]').slice(0,600);
                result.output=data.output; if(result.output) result.output=JSON.stringify(result.output).replaceAll(key,'[REDACTED]').slice(0,900);
                console.log(JSON.stringify(result));
              }catch(e){console.log(JSON.stringify({route,errorType:e.name}));}
            }
          }
          JS
