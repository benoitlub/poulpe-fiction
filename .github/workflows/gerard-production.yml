name: Gérard · Production

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      candidatures_only:
        description: "Vérifier les offres et préparer uniquement les brouillons de candidature"
        type: boolean
        default: false

jobs:
  production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: gerard-production
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    env:
      PUBLISHER_URL: https://blacklace-publisher-worker.benoitlubert.workers.dev
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GERARD_TENTACLE: production
      OCTOPUS_URL: http://127.0.0.1:3000
      LOCAL_PUBLISHER_URL: http://127.0.0.1:3100
      PUBLISHER_ADAPTER_URL: http://127.0.0.1:3100/api/octopus-adapter/execute
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      AI_PROVIDER: mistral
      METRICOOL_EXECUTION_TOKEN: ${{ secrets.METRICOOL_EXECUTION_TOKEN }}
      GERARD_METRICOOL_DIRECT_EXECUTION_ENABLED: ${{ vars.GERARD_METRICOOL_DIRECT_EXECUTION_ENABLED }}
      NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
      NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
      PUBLISHER_NOTION_WRITE_TOKEN: ${{ secrets.PUBLISHER_NOTION_WRITE_TOKEN }}
      GERARD_METRICOOL_PREPARE_ONLY: "true"
      GERARD_METRICOOL_LOCAL_ONLY: "true"
      GERARD_IMAGE_STUDIO_ENABLED: "false"
      GERARD_AV_STUDIO_ENABLED: "false"
    steps:
      - name: Runtime heartbeat
        shell: bash
        run: |
          echo "Gerard runtime started"
          echo "event=${{ github.event_name }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          date -u +"utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Checkout Poulpe Fiction
        uses: actions/checkout@v4
        with:
          path: poulpe-fiction

      - name: Checkout Octopus Engine
        uses: actions/checkout@v4
        with:
          repository: benoitlub/octopus-engine
          path: octopus

      - name: Checkout Publisher
        uses: actions/checkout@v4
        with:
          repository: benoitlub/blacklace-publisher-ai
          path: publisher

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build Octopus Engine
        working-directory: octopus
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Install Publisher
        working-directory: publisher
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Restore private runtime snapshots from the existing database
        id: restore_private
        working-directory: poulpe-fiction
        env:
          GERARD_PUBLISHER_DB_PACKAGE: ${{ github.workspace }}/publisher/lib/db/package.json
        run: node scripts/gerard-private-runtime.mjs hydrate

      # Do NOT run the DB push here: it can propose destructive schema changes
      # against the shared production database and requires an interactive TTY.
      # The deployed Worker ensures the existing schema without destroying data.

      - name: Build Publisher
        working-directory: publisher
        run: pnpm --filter @workspace/api-server run build

      - name: Start Octopus Engine locally
        working-directory: octopus
        run: |
          nohup env PORT=3000 NODE_ENV=production npm start > ../octopus.log 2>&1 &
          echo $! > ../octopus.pid

      - name: Start Publisher locally
        working-directory: publisher
        run: |
          nohup env PORT=3100 NODE_ENV=production DATABASE_URL="$DATABASE_URL" MISTRAL_API_KEY="$MISTRAL_API_KEY" NOTION_API_KEY="$NOTION_API_KEY" NOTION_PAGE_ID="$NOTION_PAGE_ID" pnpm --filter @workspace/api-server run start > ../publisher.log 2>&1 &
          echo $! > ../publisher.pid

      - name: Wait for local services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            OCTOPUS_UP=false
            PUBLISHER_UP=false
            curl --fail --silent "$OCTOPUS_URL/health" >/dev/null && OCTOPUS_UP=true || true
            curl --fail --silent "$LOCAL_PUBLISHER_URL/api/healthz" >/dev/null && PUBLISHER_UP=true || true
            if [ "$OCTOPUS_UP" = true ] && [ "$PUBLISHER_UP" = true ]; then exit 0; fi
            if ! kill -0 "$(cat octopus.pid)" 2>/dev/null; then cat octopus.log || true; exit 1; fi
            if ! kill -0 "$(cat publisher.pid)" 2>/dev/null; then cat publisher.log || true; exit 1; fi
            sleep 2
          done
          cat octopus.log || true
          cat publisher.log || true
          exit 1

      - name: Register Publisher adapter with Octopus
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST "$OCTOPUS_URL/adapters/register" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg executeUrl "$PUBLISHER_ADAPTER_URL" '{id:"publisher",name:"Blacklace Publisher",version:"github-actions",capabilities:["content.generate","knowledge.search","tool.search","content.article.write","content.social.write","social.publish","landing.generate","image.studio","audio.studio","video.studio"],executeUrl:$executeUrl}')"

      - name: Sync restart Seeds to Publisher
        working-directory: poulpe-fiction
        shell: bash
        run: |
          set -euo pipefail
          test -f garden/restart-seeds.json || exit 0
          curl --fail --silent --show-error \
            -X POST "$PUBLISHER_URL/api/tentacles/sync" \
            -H "Content-Type: application/json" \
            --data @garden/restart-seeds.json

      - name: Compost obsolete local harvests
        working-directory: poulpe-fiction
        run: node scripts/gerard-compost.mjs

      - name: Run Gerard cycle
        working-directory: poulpe-fiction
        env:
          PUBLISHER_JOB_SCRIPTS_DIR: ${{ github.workspace }}/publisher/scripts
          GERARD_JOB_SEARCH_ONLY: ${{ inputs.candidatures_only }}
        run: node scripts/gerard-cycle.mjs

      - name: Compost freshly produced local harvests
        working-directory: poulpe-fiction
        run: node scripts/gerard-compost.mjs

      - name: Prepare a social draft for the diffusion tentacle
        if: inputs.candidatures_only != true
        working-directory: poulpe-fiction
        run: node scripts/gerard-metricool-publication.mjs

      # Publication is delegated to the existing Gérard · Diffusion et courrier
      # workflow (Gmail -> Metricool), which uses the verified brand routing.
      # Do not run the obsolete Composio-backed Metricool rehearsal here:
      # it tests a different connection and reports a misleading account error.
      - name: Report Metricool delivery routing
        if: inputs.candidatures_only != true
        run: |
          echo "Metricool delivery delegated to Gérard · Diffusion et courrier."
          echo "Production prepares and persists; diffusion handles guarded mail relay."
          echo "No external publication attempted by this production step."

      - name: Persist private snapshots before publishing metadata
        if: ${{ !cancelled() && steps.restore_private.outcome == 'success' }}
        working-directory: poulpe-fiction
        env:
          GERARD_PUBLISHER_DB_PACKAGE: ${{ github.workspace }}/publisher/lib/db/package.json
        run: node scripts/gerard-private-runtime.mjs persist

      - name: Publish the redacted garden projection
        working-directory: poulpe-fiction
        shell: bash
        run: |
          set -euo pipefail
          git add -- garden/gerard-state.json garden/harvests.json
          git diff --cached --quiet && exit 0
          git -c user.name=gerard-runtime[bot] -c user.email=gerard-runtime@users.noreply.github.com commit -m "chore(gerard): refresh public production state"
          # Hydration also updates private-runtime projections outside the two
          # staged files. Rebase the committed projection in a clean worktree.
          projection_dir="$(mktemp -d)"
          git worktree add --detach "$projection_dir" HEAD
          trap 'git worktree remove --force "$projection_dir"' EXIT
          for attempt in 1 2 3; do
            git -C "$projection_dir" fetch origin main
            git -C "$projection_dir" -c user.name=gerard-runtime[bot] \
              -c user.email=gerard-runtime@users.noreply.github.com rebase origin/main
            if git -C "$projection_dir" push origin HEAD:main; then exit 0; fi
          done
          exit 1

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerard-runtime-logs
          path: |
            octopus.log
            publisher.log
            poulpe-fiction/garden/studio/**
            publisher/data/studio/jobs/**
          retention-days: 7
