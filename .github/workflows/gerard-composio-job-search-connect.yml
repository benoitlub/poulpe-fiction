name: Gerard Composio LinkedIn job-search authorization link

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gerard-composio-job-search-connect.yml"

permissions:
  id-token: write
  contents: read

jobs:
  owner-job-search-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Generate ten-minute Composio Connect Link for Gérard job search
        shell: bash
        run: |
          set -euo pipefail
          oidc_token="$(curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=blacklace-publisher-gerard-owner-test" \
            | node -e 'let s="";process.stdin.on("data",c=>s+=c);process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).value))')"
          test -n "$oidc_token"
          node -e 'const c=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url"));console.log("oidc.workflow_ref="+String(c.workflow_ref||""));console.log("oidc.event_name="+String(c.event_name||""));console.log("oidc.ref="+String(c.ref||""));console.log("oidc.repository="+String(c.repository||""));console.log("oidc.audience="+JSON.stringify(c.aud))' "$oidc_token"
          response_file="$(mktemp)"
          http_code="$(curl --silent --show-error --max-time 30 --output "$response_file" --write-out '%{http_code}' \
            -X POST 'https://blacklace-publisher-worker.benoitlubert.workers.dev/api/gerard/job-search/connect-link' \
            -H "Authorization: Bearer $oidc_token" \
            -H 'Content-Type: application/json' \
            --data '{}')"
          echo "publisher.http=$http_code"
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));console.log("publisher.status="+String(x.status||"unknown"));if(x.status==="link-ready"){console.log("composio.authorize="+x.redirectUrl);console.log("composio.expires_at="+x.expiresAt)}else{console.log("publisher.reason="+String(x.reason||"unknown"))}' "$response_file"
          test "$http_code" = 200
