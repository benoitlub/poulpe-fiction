name: Deploy Poulpe Fiction to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install FFmpeg for existing media tests
        run: |
          if ! command -v ffmpeg >/dev/null; then
            . /etc/os-release
            printf 'deb https://archive.ubuntu.com/ubuntu %s main universe\n' "$VERSION_CODENAME" > "$RUNNER_TEMP/poulpe-apt.list"
            apt_options=(-o Dir::Etc::sourcelist="$RUNNER_TEMP/poulpe-apt.list" -o Dir::Etc::sourceparts=- -o Acquire::Retries=1 -o Acquire::https::Timeout=20)
            sudo apt-get "${apt_options[@]}" update -qq
            sudo apt-get "${apt_options[@]}" install -y --no-install-recommends ffmpeg
          fi

      - name: Test before publishing
        run: npm test

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

