name: Gerard Reel 420 visual proof

on:
  pull_request:
    paths:
      - scripts/gerard-gameplay-capture.mjs
      - .github/workflows/gerard-420-visual.yml
  workflow_dispatch:
    inputs:
      capture_live_gameplay:
        description: 'Record real dice rolls from 420 Dice, silent MP4 + review report; never publish'
        type: boolean
        default: false
      capture_prohibited_gameplay:
        description: 'Record Pro.Hibited Online solo gameplay; never publish'
        type: boolean
        default: false
      generate_ai_image:
        description: 'Ask existing Publisher/Mistral to generate one image (no publication)'
        type: boolean
        default: false
      harvest_id:
        description: 'Existing Gerard harvest ID for proven Publisher social media path'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  visual:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Produce a real 9:16 visual asset
        shell: bash
        run: |
          mkdir -p output
          cat > output/420-dice-reel-vertical.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
          <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#131321"/><stop offset="1" stop-color="#39235e"/></linearGradient></defs>
          <rect width="1080" height="1920" fill="url(#bg)"/>
          <circle cx="930" cy="310" r="290" fill="#a56bff" opacity=".15"/>
          <text x="90" y="215" fill="#c8a9ff" font-family="Arial,sans-serif" font-weight="bold" font-size="58">420 DICE GAME</text>
          <text x="90" y="450" fill="white" font-family="Arial,sans-serif" font-weight="900" font-size="106">PAS DE 420 ?</text>
          <text x="90" y="580" fill="#f7d75b" font-family="Arial,sans-serif" font-weight="900" font-size="103">TU PRENDS</text>
          <text x="90" y="710" fill="#f7d75b" font-family="Arial,sans-serif" font-weight="900" font-size="103">UN GAGE.</text>
          <g transform="translate(180 910) rotate(-12)"><rect width="290" height="290" rx="42" fill="#fff"/><circle cx="145" cy="145" r="34" fill="#30244e"/></g>
          <g transform="translate(555 1020) rotate(13)"><rect width="290" height="290" rx="42" fill="#fff"/><circle cx="75" cy="75" r="27" fill="#30244e"/><circle cx="215" cy="215" r="27" fill="#30244e"/></g>
          <text x="90" y="1480" fill="white" font-family="Arial,sans-serif" font-size="65" font-weight="bold">3 DÉS · 3 LANCERS</text>
          <text x="90" y="1585" fill="#c8a9ff" font-family="Arial,sans-serif" font-size="48">Visuel promotionnel conceptuel</text>
          <text x="90" y="1650" fill="#c8a9ff" font-family="Arial,sans-serif" font-size="42">Dés illustratifs, pas une capture du jeu</text>
          <text x="90" y="1790" fill="white" font-family="Arial,sans-serif" font-size="38">benoitlub.github.io/420-dice-game-reboot/</text>
          </svg>
          SVG
          test -s output/420-dice-reel-vertical.svg
      - name: Render PNG and validate vertical format
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user cairosvg pillow
          python3 - <<'PY'
          import cairosvg
          from PIL import Image
          cairosvg.svg2png(url="output/420-dice-reel-vertical.svg",write_to="output/420-dice-reel-vertical.png",output_width=1080,output_height=1920)
          with Image.open("output/420-dice-reel-vertical.png") as image:
              assert image.size == (1080,1920),image.size
              image.verify()
          print("PNG validated: 1080x1920")
          PY
      - name: Generate image with existing Publisher Mistral capability (opt-in)
        if: ${{ inputs.generate_ai_image == true }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, pathlib
          prompt = ("Vertical 9:16 cinematic promotional key art for a playful mobile dice party game, "
                    "three ordinary six-sided dice flying across a moody purple and golden tabletop, "
                    "friends laughing in background, premium photographic advertising composition, "
                    "leave clean space in upper third for later French typography, no text, no logos, "
                    "no cannabis imagery. Dice are illustrative and not a screenshot of gameplay.")
          base="https://blacklace-publisher-worker.benoitlubert.workers.dev"
          url=base+"/api/production/mistral-image/test?"+urllib.parse.urlencode({"prompt":prompt})
          request=urllib.request.Request(url,headers={"Accept":"application/json"})
          try:
              with urllib.request.urlopen(request,timeout=110) as response:
                  data=json.load(response)
          except Exception as exc:
              raise SystemExit("Publisher Mistral generation failed: "+str(exc))
          pathlib.Path("output/ai-result.json").write_text(json.dumps(data,ensure_ascii=False,indent=2))
          if data.get("status")!="generated":
              raise SystemExit("Publisher did not confirm generated image")
          result=data.get("result") or {}
          file_id=result.get("fileId") or result.get("file_id")
          if not file_id:
              raise SystemExit("Generated response saved, but no fileId available; inspect ai-result.json")
          download=base+"/api/production/mistral-image/content?"+urllib.parse.urlencode({"fileId":file_id})
          with urllib.request.urlopen(download,timeout=90) as response:
              content=response.read()
          if len(content)<1000: raise SystemExit("Downloaded image too small")
          import io, hashlib
          from PIL import Image
          with Image.open(io.BytesIO(content)) as image:
              image.verify()
          with Image.open(io.BytesIO(content)) as image:
              image.load()
              image.save("output/420-dice-ai-image.png", format="PNG")
          data["retrieval"]={"fileId":file_id,"sourceBytes":len(content),"sourceSha256":hashlib.sha256(content).hexdigest(),"verifiedFile":True,"published":False}
          pathlib.Path("output/ai-result.json").write_text(json.dumps(data,ensure_ascii=False,indent=2))
          PY
      - name: Upload AI result for autonomous learning
        if: ${{ always() && inputs.generate_ai_image == true }}
        uses: actions/upload-artifact@v4
        with:
          name: gerard-420-dice-mistral-attempt
          path: |
            output/ai-result.json
            output/420-dice-ai-image.png
          retention-days: 14
          if-no-files-found: error
      - name: Reuse Gerard existing harvest media producer
        if: ${{ inputs.harvest_id != '' }}
        env:
          HARVEST_ID: ${{ inputs.harvest_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, urllib.request, pathlib
          endpoint="https://blacklace-publisher-worker.benoitlubert.workers.dev/api/social/media/request"
          payload=json.dumps({"harvestId":os.environ["HARVEST_ID"]}).encode()
          req=urllib.request.Request(endpoint,data=payload,headers={"Content-Type":"application/json"},method="POST")
          try:
              with urllib.request.urlopen(req,timeout=150) as response:
                  data=json.load(response)
          except Exception as exc:
              raise SystemExit("Existing harvest media producer failed: "+str(exc))
          pathlib.Path("output/gerard-harvest-media.json").write_text(json.dumps(data,ensure_ascii=False,indent=2))
          if data.get("status")!="publishable":
              raise SystemExit("Existing harvest not publishable; see output/gerard-harvest-media.json")
          print("Verified existing Gerard harvest media production:",data.get("verification",{}))
          PY
      - name: Upload existing producer response
        if: ${{ inputs.harvest_id != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gerard-420-existing-media-production
          path: output/gerard-harvest-media.json
          retention-days: 14
      - name: Upload visual for autonomous learning
        uses: actions/upload-artifact@v4
        with:
          name: gerard-420-dice-vertical-visual
          path: |
            output/420-dice-reel-vertical.svg
            output/420-dice-reel-vertical.png
          retention-days: 14

  gameplay_capture:
    name: Capture real gameplay (manual, review only)
    if: ${{ inputs.capture_live_gameplay || inputs.capture_prohibited_gameplay || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Poulpe Fiction
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test capture evidence safeguards
        run: node --test tests/gerard-gameplay-capture.test.mjs
      - name: Install browser and codecs in isolated runner directory
        env:
          GERARD_PLAYWRIGHT_DIR: ${{ runner.temp }}/gerard-playwright
        run: |
          set -euo pipefail
          mkdir -p "$GERARD_PLAYWRIGHT_DIR"
          npm install --prefix "$GERARD_PLAYWRIGHT_DIR" --no-save --ignore-scripts --package-lock=false --no-audit --no-fund playwright
          "$GERARD_PLAYWRIGHT_DIR/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Record authentic dice rolls (no external POST)
        if: ${{ inputs.capture_live_gameplay }}
        env:
          GERARD_PLAYWRIGHT_MODULE: ${{ runner.temp }}/gerard-playwright/node_modules/playwright/index.mjs
        run: |
          node --input-type=module -e 'await import(process.env.GERARD_PLAYWRIGHT_MODULE)'
          node scripts/gerard-gameplay-capture.mjs output/gameplay
      - name: Record a Pro.Hibited Online solo turn (no external POST)
        if: ${{ inputs.capture_prohibited_gameplay || github.event_name == 'pull_request' }}
        env:
          GERARD_PLAYWRIGHT_MODULE: ${{ runner.temp }}/gerard-playwright/node_modules/playwright/index.mjs
        run: node scripts/gerard-gameplay-capture.mjs output/prohibited-gameplay prohibited-online
      - name: Checkout Publisher Studio
        if: ${{ inputs.capture_prohibited_gameplay || github.event_name == 'pull_request' }}
        uses: actions/checkout@v4
        with:
          repository: benoitlub/blacklace-publisher-ai
          path: publisher
      - name: Mount and score the captured gameplay in Publisher
        if: ${{ inputs.capture_prohibited_gameplay || github.event_name == 'pull_request' }}
        working-directory: publisher
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          python3 -m venv .studio-venv
          .studio-venv/bin/pip install 'piper-tts==1.8.0'
          # Pin the upstream model revision to the checksum verified by Publisher.
          mkdir -p data/studio-models
          model_url=https://huggingface.co/rhasspy/piper-voices/resolve/d5de91c972ba5a13cea0e77a63fda1623faac2c1/fr/fr_FR/siwis/medium
          for file in fr_FR-siwis-medium.onnx fr_FR-siwis-medium.onnx.json MODEL_CARD; do
            curl --fail --location --silent --show-error --retry 2 --max-time 180 \
              "$model_url/$file?download=true" --output "data/studio-models/$file"
          done
          python3 scripts/setup-studio-voice.py
          export PIPER_BIN="$PWD/.studio-venv/bin/piper"
          export PIPER_MODEL="$PWD/data/studio-models/fr_FR-siwis-medium.onnx"
          export PIPER_MODEL_SHA256=641d1ab097da2b81128c076810edb052b385decc8be3381814802a64a73baf99
          export STUDIO_ASSETS_DIR="$PWD/data/studio-inputs"
          asset_id=prohibited-online-captured-gameplay
          source_url=https://benoitlub.github.io/prohibited-online/
          cp ../output/prohibited-gameplay/gameplay-vertical.mp4 "$STUDIO_ASSETS_DIR/$asset_id.mp4"
          read -r asset_sha _ < <(sha256sum "$STUDIO_ASSETS_DIR/$asset_id.mp4")
          jq -e --arg sha "$asset_sha" '.files["gameplay-vertical.mp4"].sha256 == $sha and .technicalQuality == "passed"' ../output/prohibited-gameplay/review-report.json
          jq --arg id "$asset_id" --arg sha "$asset_sha" --arg source "$source_url" \
            '.assets += [{id:$id,parcelId:"prohibited-online",file:($id+".mp4"),sha256:$sha,rights:{license:"LicenseRef-Owner-Authorized-Preview",scope:"local-preview",source:$source,attribution:"Partie enregistrée dans le jeu de Benoît Lubert"}}]' \
            "$STUDIO_ASSETS_DIR/assets.json" > "$STUDIO_ASSETS_DIR/assets.tmp.json"
          mv "$STUDIO_ASSETS_DIR/assets.tmp.json" "$STUDIO_ASSETS_DIR/assets.json"
          jq -n --arg id "$asset_id" --arg source "$source_url" --arg operation "prohibited-online-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            '{version:"studio-v1",parcelId:"prohibited-online",seedId:"prohibited-online-gameplay-preview",operationId:$operation,durationSeconds:10,title:"PRO.HIBITED ONLINE",videoAssetId:$id,segments:[{text:"Une table, cinq cartes en main.",caption:"Une table, cinq cartes en main."},{text:"Joue ou défausse une carte.",caption:"Joue ou défausse une carte."},{text:"Le bot prend la main. À toi de réagir !",caption:"Le bot prend la main. À toi de réagir !"}],scriptRights:{source:$source,attribution:"Texte de démonstration écrit pour la capture."},authorizedResources:["video.studio"],automaticPublication:false}' \
            > examples/studio/prohibited-online-preview.json
          pnpm --filter @workspace/scripts exec tsx ./render-short.mts ../examples/studio/prohibited-online-preview.json | tee ../output/prohibited-gameplay/studio-report.json
          find data/studio/jobs -name short.mp4 -exec cp '{}' ../output/prohibited-gameplay/prohibited-online-short.mp4 \;
          test -s ../output/prohibited-gameplay/prohibited-online-short.mp4
      - name: Upload Pro.Hibited Online footage and proof
        if: ${{ always() && (inputs.capture_prohibited_gameplay || github.event_name == 'pull_request') }}
        uses: actions/upload-artifact@v4
        with:
          name: gerard-prohibited-real-gameplay-${{ github.run_id }}
          path: |
            output/prohibited-gameplay/gameplay-vertical.mp4
            output/prohibited-gameplay/final-frame.png
            output/prohibited-gameplay/prohibited-online-short.mp4
            output/prohibited-gameplay/studio-report.json
            publisher/data/studio-models/MODEL_CARD
            output/prohibited-gameplay/review-report.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload review-only source footage and proof
        if: ${{ always() && inputs.capture_live_gameplay }}
        uses: actions/upload-artifact@v4
        with:
          name: gerard-420-real-gameplay-${{ github.run_id }}
          path: |
            output/gameplay/gameplay-vertical.mp4
            output/gameplay/gameplay-source.webm
            output/gameplay/final-frame.png
            output/gameplay/review-report.json
          retention-days: 14
          if-no-files-found: warn
