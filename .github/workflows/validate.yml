name: Validate Poulpe Fiction

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/adopt-garden

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Install media test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Test
        run: npm test

