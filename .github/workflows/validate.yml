name: Validate Poulpe Fiction

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/adopt-garden

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Prepare image validation tools
        timeout-minutes: 5
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=30
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=30 ffmpeg
          fi
          ffmpeg -version
          ffprobe -version

      - name: Test
        run: npm test

