<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poulpe Fiction · Récoltes Yaébali</title><style>
:root{color-scheme:dark}body{margin:0;background:#0b1024;color:#f2f5ff;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:24px}a{color:#75e5d5}article{background:#18223c;border:1px solid #374362;border-radius:14px;padding:16px;margin:12px 0}button{background:#46d9c4;color:#071827;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;margin-right:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:14px/1.5 system-ui,sans-serif}small{color:#b4c0d6}</style></head><body><main><p><a href="./mobile-v2.html">← Retour à Poulpe Fiction</a></p><h1>Récoltes Yaébali</h1><p>Consulte et télécharge les documents produits par Gérard. Une récolte n'est pas une preuve de prospects contactés ou de ventes.</p><p id="status">Chargement des récoltes…</p><section id="items"></section></main><script>
const endpoint="https://raw.githubusercontent.com/benoitlub/poulpe-fiction/main/garden/harvests.json";
const items=document.getElementById("items"),status=document.getElementById("status");
function download(content,name,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
fetch(endpoint,{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(data=>{
const harvests=(Array.isArray(data.harvests)?data.harvests:[]).filter(h=>/ya[eé]bali|yael/i.test([h.seedId,h.parcelId,h.title].join(" "))).sort((a,b)=>String(b.harvestedAt).localeCompare(String(a.harvestedAt)));
status.textContent=harvests.length+" récolte(s) trouvée(s). Données issues du dépôt GitHub.";
if(!harvests.length)return;
for(const h of harvests){const article=document.createElement("article"),heading=document.createElement("h2"),meta=document.createElement("small"),preview=document.createElement("details"),summary=document.createElement("summary"),pre=document.createElement("pre"),md=document.createElement("button"),json=document.createElement("button");heading.textContent=h.title||"Récolte";meta.textContent=h.harvestedAt||"Date inconnue";summary.textContent="Lire le contenu";pre.textContent=h.content||"Aucun contenu texte";preview.append(summary,pre);const name="yaebali-"+String(h.harvestedAt||"recolte").slice(0,10)+"-"+String(h.harvestId||"document").replace(/[^a-z0-9-]/gi,"-");md.textContent="Télécharger .md";md.onclick=()=>download("# "+(h.title||"Yaébali")+"\n\n"+(h.content||""),name+".md","text/markdown;charset=utf-8");json.textContent="Télécharger .json";json.onclick=()=>download(JSON.stringify(h,null,2),name+".json","application/json;charset=utf-8");article.append(heading,meta,document.createElement("p"),md,json,preview);items.append(article)}
}).catch(e=>{status.textContent="Chargement impossible : "+e.message+". Vérifie que le dépôt et le fichier sont publics.";});
</script></body></html>
